[project]
name = "context-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1",
 "uvicorn[standard]>=0.34,<1",
 "pydantic-settings>=2.8,<3",
 "sqlalchemy[asyncio]>=2.0,<3",
 "asyncpg>=0.30,<1",
 "alembic>=1.15,<2",
 "qdrant-client>=1.14,<2",
 "langgraph>=1,<2",
 "langchain>=1,<2",
 "httpx>=0.28,<1",
 "jsonschema>=4,<5",
 "langchain-google-genai>=4,<5",
 "google-genai>=1,<2",
 "pwdlib[argon2]>=0.3,<1",
 "pyjwt>=2.10,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]
[project.scripts]
context-agent = "context_agent.cli:main"
context-agent-super-admin = "super_admin.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/context_agent", "src/super_admin", "src/dashboard", "src/knowledge_base", "src/custom_fields", "src/products", "src/modules", "src/crm", "src/services", "src/orders", "src/appointments", "src/public_chat", "src/integrations"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
